name: tests
on: [push, pull_request]
jobs:
  tabular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_baselines.py --seeds 0 --output results/ci.json
