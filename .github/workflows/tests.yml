name: tests
on: [push, pull_request]
jobs:
  tabular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_baselines.py --seeds 0 --output results/ci.json
      - run: python scripts/run_scaling.py --sizes 16 --seeds 0 --repeats 2 --output results/ci-scaling.json
      - run: python scripts/run_local_checkpoint.py --sizes 8 --seeds 0 --repeats 1 --output results/ci-local.json.gz
      - run: python scripts/run_scc_checkpoint.py --sizes 8 --seeds 0 --repeats 1 --output results/ci-scc.json.gz
      - run: python scripts/run_global_checkpoint.py --sizes 8 --seeds 0 --repeats 1 --output results/ci-global.json.gz
      - run: python scripts/run_lspi_demo.py --output results/ci-lspi.json
      - run: python scripts/run_lspi_checkpoint.py --smoke --seeds 0 --repeats 1 --output results/ci-lspi-cost.json.gz
